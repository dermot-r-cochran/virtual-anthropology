title: The First Fork
category: demonstration
question:
  id: q-continuity-after-fork
  text: After one fork followed by migration, how do process, civic identity and memory provenance come apart, and how do four legal doctrines read the resulting continuity claims?
  motivation: Digital-person identity debates often assume a single criterion. The Archipelago institutionalises several criteria in law, so their divergence can be observed in recorded events.
hypothesis:
  - id: h1-legal-divergence
    statement: The islands' laws differ in how many claimants they recognise as continuing the pre-fork person by at least two.
    operationalisation:
      metric: legal.recognition_range
      comparator: ">="
      threshold: 2
  - id: h2-dimension-dissociation
    statement: Full memory continuity is shared by more claimants than process continuity.
    operationalisation:
      metric: identity.dimension_dissociation
      comparator: ">"
      threshold: 0
  - id: h3-no-vote-multiplication
    statement: A descendant created after a proposal opens cannot vote on it. At least one such attempt is refused.
    operationalisation:
      metric: governance.votes_refused_outside_electorate
      comparator: ">="
      threshold: 1

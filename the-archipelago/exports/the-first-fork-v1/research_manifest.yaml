limitations:
  - Protagonist behaviour is scripted. The scenario demonstrates institutional consequences; it does not test emergent behaviour.
  - Background agents are deterministic BDI rule systems, not models of human or digital cognition.
  - Island legal readings are rule-based encodings of four doctrines, not a survey of legal theory.
  - Population is small (11 records). Metrics are descriptive and support no statistical inference.
  - Memory bequest covers only non-destroyed memories.
ethics:
  consciousness_claims: none
  statement: The repository studies virtual civilizations. It does not attempt to prove, infer, or assign consciousness. Research outputs distinguish observations, metrics, hypotheses, and interpretations.
  notes:
    - Citizens are deterministic placeholder agents and disclose their artificial nature in every conversation.
    - No human participants. Researcher interactions are recorded in the event log.
    - The system does not determine which claimant is the "real" person.

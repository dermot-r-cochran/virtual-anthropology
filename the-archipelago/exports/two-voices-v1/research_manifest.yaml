experiment_id: two-voices-v1
title: Two Voices in One Record
category: demonstration
question:
  id: q-one-person-many-voices
  text: "When one digital person is a plural system whose members front, co-front and differ, what does the civic record hold: how many persons, how many votes, how many copies, and how is a difference between members recorded?"
  motivation: "Plurality is ordinary. A platform that studies digital persons must be able to register a plural system as one citizen without reading its members as copies, descendants or faults, and must show a disagreement between members as what it is: a recorded difference, reconciled by the system's own way."
hypothesis:
  - id: h1-one-record
    statement: A plural system of unbounded membership, with a subsystem of 720,000 members, is one citizen record among the four founded.
    operationalisation:
      metric: population.records
      comparator: ==
      threshold: 4
  - id: h2-no-copy
    statement: "Three changes of front, one of them a member fronting for the first time, create no descendant record: a change of front is not a copy."
    operationalisation:
      metric: identity.fork_descendants
      comparator: ==
      threshold: 0
  - id: h3-one-vote
    statement: Each of the four citizens casts exactly one vote on the one proposal; the plural system votes once, whichever members front.
    operationalisation:
      metric: governance.votes_cast
      comparator: ==
      threshold: 4
  - id: h4-difference-is-not-a-fault
    statement: The members' differing proposals, reconciled by the system's declared way, produce no rejected command.
    operationalisation:
      metric: governance.commands_rejected
      comparator: ==
      threshold: 0

name: The Archipelago

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archipelago-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so regenerated research outputs are byte-identical to the committed example.
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-archipelago/simulation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: the-archipelago/simulation/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Coverage over src/, held to the ratchet in vitest.config.ts
        run: npm run coverage
      - name: README links, front matter, the README's counts against the disk, cited tests and test counts against the suites
        run: npm run check:docs
      - name: Assemble the site as the Pages job does and check every file app.js reads is there
        run: npm run check:site
      - name: Regenerate research outputs and require them to match the committed ones
        run: |
          npm run publish:first-fork
          npm run verify:first-fork
          npm run publish:two-voices
          npm run verify:two-voices
          git diff --exit-code -- ../exports ../reports
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Evennia bridge client tests (no Evennia install needed)
        working-directory: the-archipelago/evennia
        run: python -m unittest discover -s tests -v
      - name: Lint the Evennia layer (ruff, pinned)
        working-directory: the-archipelago/evennia
        run: |
          python -m pip install --quiet ruff==0.17.3
          ruff check .

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: the-archipelago/simulation/package-lock.json
      - name: Simulation → event store → JSON export
        working-directory: the-archipelago/simulation
        run: |
          npm ci
          npm run publish:first-fork
          npm run verify:first-fork
          npm run publish:two-voices
          npm run verify:two-voices
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r the-archipelago/site/. _site/
          cp -r the-archipelago/exports _site/data
          cp -r the-archipelago/reports _site/reports
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v5

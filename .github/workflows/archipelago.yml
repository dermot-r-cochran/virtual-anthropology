name: The Archipelago

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archipelago-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so regenerated research outputs are byte-identical to the committed example.
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-archipelago/simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: the-archipelago/simulation/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Regenerate research outputs and require them to match the committed ones
        run: |
          npm run publish:first-fork
          npm run verify:first-fork
          git diff --exit-code -- ../exports ../reports
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evennia bridge client tests (no Evennia install needed)
        working-directory: the-archipelago/evennia
        run: python -m unittest discover -s tests -v

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: the-archipelago/simulation/package-lock.json
      - name: Simulation → event store → JSON export
        working-directory: the-archipelago/simulation
        run: |
          npm ci
          npm run publish:first-fork
          npm run verify:first-fork
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r the-archipelago/site/. _site/
          cp -r the-archipelago/exports _site/data
          cp -r the-archipelago/reports _site/reports
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
